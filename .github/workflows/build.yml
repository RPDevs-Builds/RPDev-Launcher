name: RPDev Launcher CI & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build RPDev Launcher APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleAospOmegaDebug --stacktrace

      - name: Run Unit Tests
        run: ./gradlew testAospOmegaDebugUnitTest

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew assembleAospOmegaRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: RPDev-Launcher-Debug-APK
          path: build/outputs/apk/aospOmega/debug/RPDev_Launcher_*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: RPDev-Launcher-Release-APK
          path: build/outputs/apk/aospOmega/release/RPDev_Launcher_*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (On Version Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/apk/aospOmega/release/RPDev_Launcher_*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
